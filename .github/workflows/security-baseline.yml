name: Security Baseline

on:
  pull_request:
  push:
    branches: [main, master, codex/**]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --json

  dev-dependency-audit-monitor:
    name: Dev dependency audit monitor (non-blocking)
    # Dev-tool advisories are tracked separately until a compatible upstream fix exists.
    # This job is never part of a pull request or push merge gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Record development dependency audit
        shell: bash
        run: |
          set +e
          npm audit --include=dev --json > dev-dependency-audit.json
          audit_exit=$?
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            let report;
            try {
              report = JSON.parse(readFileSync("dev-dependency-audit.json", "utf8"));
            } catch (error) {
              report = { error: String(error) };
            }
            const counts = report.metadata?.vulnerabilities;
            console.log("## Development dependency audit (monitor only)");
            if (counts) {
              console.log(`- Critical: ${counts.critical}`);
              console.log(`- High: ${counts.high}`);
              console.log(`- Moderate: ${counts.moderate}`);
              console.log(`- Low: ${counts.low}`);
              console.log(`- Total: ${counts.total}`);
            } else {
              console.log("- Audit report could not be parsed; inspect the attached JSON artifact.");
            }
            console.log("- Policy: recorded for Issue #1 follow-up; does not block pull requests or main merges.");
          ' >> "$GITHUB_STEP_SUMMARY"
          echo "npm audit exit code: $audit_exit (recorded only; this monitor exits successfully)." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dev-dependency-audit-${{ github.run_id }}
          path: dev-dependency-audit.json
          retention-days: 30

  source-security:
    name: Source security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: semgrep/semgrep-action@v1
        env:
          SEMGREP_RULES: .semgrep.yml
          SEMGREP_SEND_METRICS: "off"

  quality-contract:
    name: Type, lint and security policy contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/tests/security-baseline-contract.test.mjs
      # Next.js generates global PageProps/LayoutProps used by the app during typegen.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
